<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webcam: gaze lab</title>
<style>
  :root { color-scheme: dark; --ink:#e8eefc; --dim:#8b96ad; --line:#1f2836; --bg:#05070d; --panel:rgba(9,13,21,.82); --ok:#5fe3a1; --warn:#ffc266; --bad:#ff7a7a; --accent:#7fd4ff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 500 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; left: 16px; top: 16px; width: 264px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); display: grid; gap: 10px; z-index: 5; }
  h1 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin: 0; font-weight: 600; }
  button { font: inherit; font-weight: 650; color: #04121c; background: var(--accent); border: 0; border-radius: 9px; padding: 9px 12px; cursor: pointer; }
  button.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-variant-numeric: tabular-nums; }
  dt { color: var(--dim); } dd { margin: 0; text-align: right; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .preview { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); }
  .preview video, .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #target { position: fixed; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 3px solid var(--warn); display: none; z-index: 4; pointer-events: none; }
  #target::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; }
  #report { color: var(--dim); min-height: 2.9em; margin: 0; }
  #modules { left: auto; right: 16px; width: 300px; max-height: calc(100% - 32px); overflow: auto; }
  #events { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; color: var(--dim); }
  #events li { border-left: 3px solid var(--line); padding-left: 8px; }
  #events li b { color: var(--ink); font-weight: 650; }
  @media (max-width: 620px) { .panel { width: auto; right: 16px; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="target"></div>
<section class="panel">
  <h1>Gaze lab</h1>
  <div class="row">
    <button id="camera">Use this camera</button>
    <button id="remote" class="quiet" title="Use a tracker page open on a phone or in another window">Use a phone</button>
  </div>
  <div class="row">
    <button id="calibrate" class="quiet" disabled>Calibrate</button>
    <button id="check" class="quiet" disabled>Check accuracy</button>
  </div>
  <button id="mouse" class="quiet">Simulate with the mouse</button>
  <button id="synth" class="quiet" title="Run the modules on a scripted synthetic face: no camera, no face model">Run modules on a synthetic face</button>
  <button id="report-copy" class="quiet" disabled title="Copy the numbers from the last calibration and accuracy check">Copy report</button>
  <div class="preview" id="preview" hidden><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
  <dl>
    <dt>Source</dt><dd id="s-source">none</dd>
    <dt>Frames</dt><dd id="s-fps">-</dd>
    <dt>Face</dt><dd id="s-face">-</dd>
    <dt>Calibrated</dt><dd id="s-calib">-</dd>
    <dt>Gaze</dt><dd id="s-gaze">-</dd>
    <dt>Confidence</dt><dd id="s-conf">-</dd>
    <dt>Distance</dt><dd id="s-dist">-</dd>
    <dt>Face vs lens</dt><dd id="s-plane">-</dd>
    <dt>Learned</dt><dd id="s-learned">-</dd>
  </dl>
  <p id="report">Start a source, calibrate, then look around: the tiles you look at lift toward you.</p>
</section>
<section class="panel" id="modules" hidden>
  <h1>Modules</h1>
  <dl>
    <dt>Faces</dt><dd id="m-faces">-</dd>
    <dt>Presence</dt><dd id="m-presence">-</dd>
    <dt>Identity</dt><dd id="m-identity">-</dd>
    <dt>Setup</dt><dd id="m-setup">-</dd>
    <dt>Looking</dt><dd id="m-region">-</dd>
    <dt>Dwell</dt><dd id="m-dwell">-</dd>
    <dt>Angles</dt><dd id="m-angles">-</dd>
  </dl>
  <button id="m-rebase" class="quiet" title="Look at the middle of the screen, then press: re-learns where 'on-screen' is">Look here = on-screen</button>
  <h1>Events</h1>
  <ol id="events"></ol>
</section>
<script type="module" src="./demo.js"></script>
</body>
</html>
